project:
  name: "Taylor and Francis Voice Analysis"

journals:
  - name: "Journal of Natural History"
    issn: "0022-2933"
  - name: "Preparative Biochemistry and Biotechnology"
    issn: "1082-6068"
  - name: "Toxicology Mechanisms and Methods"
    issn: "1537-6516"
  - name: "Annals of Medicine"
    issn: "0785-3890"
  - name: "Journal of Applied Statistics"
    issn: "0266-4763"
  - name: "Coastal Management"
    issn: "0892-0753"
  - name: "International Journal of Environmental Health Research"
    issn: "0960-3123"

years: [2005, 2010, 2015, 2020, 2025]
papers_per_year: 40

fetching:
  api_source: "taylor_and_francis"
  use_issn: true

nlp:
  spacy_model: "en_core_web_sm"
  min_sentence_words: 5
  target_sections: ["introduction", "methods", "results", "discussion"]
