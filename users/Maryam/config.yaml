project:
  name: "Springer Nature Voice Analysis"

journals:
  - name: "Nature"
    issn: "1476-4687"
  - name: "Nature Genetics"
    issn: "1546-1718"
  - name: "Nature Neuroscience"
    issn: "1546-1726"
  - name: "Nature Medicine"
    issn: "1546-170X"
  - name: "Nature Cell Biology"
    issn: "1465-7392"
  - name: "Nature Materials"
    issn: "1476-1122"
  - name: "Cell Death and Differentiation"
    issn: "1350-9047"

years: [2005, 2010, 2015, 2020, 2025]
papers_per_year: 40

fetching:
  api_source: "springer_nature"
  use_issn: true

nlp:
  spacy_model: "en_core_web_sm"
  min_sentence_words: 5
  target_sections: ["introduction", "methods", "results", "discussion"]
